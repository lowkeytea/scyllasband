[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scyllasband"
version = "3.0.0"
description = "Inference runtime and bundle contract for Scylla's Band text-to-speech"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "ai-edge-litert>=2.2,<2.3", "huggingface_hub>=0.23"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.18"]
cuda = ["onnxruntime-gpu[cuda,cudnn]>=1.21"]
coreml = ["coremltools>=8.3"]
coreai = ["coreai-core>=1.0.0b3"]

[project.scripts]
scyllasband = "scyllasband.cli:main"
scyllasband-speak = "scyllasband.cli:speak_main"
scyllasband-group-speak = "scyllasband.cli:group_main"
scyllasband-sing = "scyllasband.cli:sing_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scyllasband*"]
