services:
  scyllasband-wyoming:
    build: .
    image: scyllasband-wyoming:local
    container_name: scyllasband-wyoming
    ports:
      - "10211:10210"
      # OpenAI-compatible speech endpoint, off by default: uncomment this line and OPENAI_HTTP_PORT below.
      # - "10215:8000"
    volumes:
      # Pronunciation overrides survive rebuilds; the image seeds an empty dict.
      - pronunciation:/data
    restart: unless-stopped
    environment:
      SCYLLASBAND_VOICE: orpheus
      SCYLLASBAND_LANGUAGE: en_gb
      # Leave delivery unset so each voice's own defaults apply.
      # SCYLLASBAND_INTENSITY: "0"
      # SCYLLASBAND_PACE: "0"
      # SCYLLASBAND_PITCH: "0"
      # OPENAI_HTTP_PORT: "8000"
      # OPENAI_API_KEY: "choose-a-key"

volumes:
  pronunciation:
