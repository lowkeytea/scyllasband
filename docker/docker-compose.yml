services:
  scyllasband-wyoming:
    build: .
    image: scyllasband-wyoming:local
    container_name: scyllasband-wyoming
    ports:
      - "10211:10210"
    volumes:
      # Editable pronunciation overrides; use pron_helper.py to add words.
      - ./phoneme_dict.json:/models/litert/assets/g2p/phoneme_dict.json
      - .:/app/pronunciation
      - ./pron_helper.py:/app/pron_helper.py:ro
    restart: unless-stopped
    environment:
      SCYLLASBAND_VOICE: orpheus
      SCYLLASBAND_LANGUAGE: en_gb
      SCYLLASBAND_INTENSITY: "0"
      SCYLLASBAND_PACE: "0"
      SCYLLASBAND_PITCH: "0"
